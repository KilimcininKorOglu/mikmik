[package]
name = "mikmik-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brush-core = { workspace = true }
brush-parser = { workspace = true }
brush-builtins = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
serde_json = { workspace = true }

# The utilities that ship inside the binary, so a machine with no coreutils
# (Windows, a stripped container) still runs what the model writes.
brush-coreutils-builtins = { version = "0.1", features = ["coreutils.all"] }
# The patched fork in `vendor/coreutils/`, reached through the workspace
# patch table. `streams` is what lets a utility's output be redirected.
uucore = "0.8"
findutils = "0.10"
# `sed` is the crate's own name, which collides with the module that adapts it.
sed_crate = { package = "sed", version = "0.1" }
# jq. A library rather than a binary, so it runs in this process.
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"

# Listing this process's children, where the platform has no cheap call of its
# own. Linux reads /proc and Darwin asks libproc, so this is Windows only.
# `system` alone: the disk, network and component listings are not wanted.
[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "ios")))'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
# Listing this process's children before every command, and `killpg` on the
# timeout path: the shell runs in this process, so what has to be killed is the
# process group of whatever the command started.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
