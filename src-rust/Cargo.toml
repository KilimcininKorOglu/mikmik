[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/tools",
    "crates/query",
    "crates/tui",
    "crates/commands",
    "crates/mcp",
    "crates/bridge",
    "crates/cli",
    "crates/buddy",
    "crates/plugins",
    "crates/acp",
    "crates/shell",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
authors = ["MikMik"]
license = "GPL-3.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# HTTP
# rustls (pas native-tls/openssl) pour cohabiter avec wreq/BoringSSL sans conflit
# de symboles (openssl-sys ↔ boring-sys). aws-lc-rs préfixe ses symboles.
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "multipart", "form", "query"], default-features = false }
# wreq = client BoringSSL avec impersonation TLS (profil Bun) — chemin Anthropic uniquement.
# TODO(#227): pinned to the 6.x / 3.x release-candidate line. No stable (non-rc)
# release exists yet — the latest stable is wreq 5.3.0 / wreq-util 2.2.6, a major
# version behind that drops the TLS-impersonation API this crate relies on.
# Revisit unpinning once wreq 6.0.0 / wreq-util 3.0.0 ship a stable release.
wreq = { version = "=6.0.0-rc.29", features = ["json", "stream"] }
wreq-util = "=3.0.0-rc.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env", "string"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.29", features = ["event-stream"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"
walkdir = "2"
# Directory walking that reads .gitignore / .ignore, for the Glob and Grep tools.
ignore = "0.4"
# ripgrep's own search engine, used by the Grep tool. `grep-searcher` owns the
# line buffering and the binary detection; `grep-regex` compiles the pattern
# into a line-oriented matcher.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
tempfile = "3"
dirs = "5"
which = "7"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
enigo = "0.2"
xcap = "0.0.13"
url = "2"
mime = "0.3"
urlencoding = "2"
open = "5"
qrcode = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
icy_sixel = "0.5"
image = { version = "0.25", features = ["png", "jpeg"] }

# Text processing
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html"] }
unicode-width = "0.2"
unicode-segmentation = "1"

# Process execution
# `term` is for `pty::openpty`: the embedded shell is handed the slave side, so
# the programs a command starts still see a terminal.
nix = { version = "0.29", features = ["process", "signal", "user", "term"] }

# Async channels
tokio-util = { version = "0.7", features = ["codec", "rt"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# JSON Schema
schemars = { version = "0.8", features = ["derive"] }

# Desktop notifications. Pulls one backend per platform:
# mac-notification-sys, tauri-winrt-notification, and pure-Rust D-Bus on
# Linux — no system library is needed at build time.
notify-rust = "4.18"

# Workspace crates
mikmik-core = { path = "crates/core" }
mikmik-acp = { path = "crates/acp" }
mikmik-api = { path = "crates/api" }
mikmik-tools = { path = "crates/tools" }
mikmik-query = { path = "crates/query" }
mikmik-tui = { path = "crates/tui" }
mikmik-commands = { path = "crates/commands" }
mikmik-mcp = { path = "crates/mcp" }
mikmik-bridge = { path = "crates/bridge" }
mikmik-buddy = { path = "crates/buddy" }
mikmik-plugins = { path = "crates/plugins" }
mikmik-shell = { path = "crates/shell" }

# The embedded shell. `brush-core` parses and executes; `brush-builtins`
# supplies the shell built-ins that used to come from the bash binary. Both
# are MIT and both build on Windows, which is the point: the same shell runs
# everywhere rather than degrading to `cmd`.
brush-core = "0.5"
brush-parser = "0.4"
brush-builtins = "0.2"

# Shipped binaries statically link two TLS stacks (rustls + BoringSSL),
# bundled SQLite, syntect, and image codecs — LTO and symbol stripping cut
# size substantially. Keep the default panic = "unwind": the TUI panic hook
# relies on unwinding to restore the terminal (raw mode, cursor) on panic.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
