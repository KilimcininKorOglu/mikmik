[package]
name = "mikmik-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Self-hosted relay that lets a phone or browser drive a running mikmik session"
license = "MIT"
publish = false

# Deliberately NOT a member of the src-rust workspace. The relay carries none
# of mikmik's dependency tree, which keeps the Docker image small and keeps
# the release/version-stamping process untouched.

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
anyhow = "1"
# Content-hash ETags for the embedded web assets, computed once at startup.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# `test-util` provides the paused clock, so the long-poll test does not spend
# 25 seconds actually waiting.
tokio = { version = "1.44", features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
