[package]
name = "mikmik-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brush-core = { workspace = true }
brush-parser = { workspace = true }
brush-builtins = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `killpg` on the timeout path: the shell runs in this process, so what has to
# be killed is the process group of whatever the command started.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
