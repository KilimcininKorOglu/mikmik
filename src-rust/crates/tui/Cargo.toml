[package]
name = "mikmik-tui"
version.workspace = true
edition.workspace = true

[features]
# Extra footer gauge fed by MIKMIK_TOKEN_BUDGET. Nothing in `core` is gated by
# it, so it forwards nowhere.
token_budget = []
# UI & Interaction features (pass-through from cc-core)
ultraplan = ["mikmik-core/ultraplan"]
ultrathink = ["mikmik-core/ultrathink"]
history_picker = ["mikmik-core/history_picker"]
message_actions = ["mikmik-core/message_actions"]
quick_search = ["mikmik-core/quick_search"]
away_summary = ["mikmik-core/away_summary"]
hook_prompts = ["mikmik-core/hook_prompts"]
kairos_brief = ["mikmik-core/kairos_brief"]
kairos_channels = ["mikmik-core/kairos_channels"]
lodestone = ["mikmik-core/lodestone"]

# Agents & Memory features (pass-through from cc-core)
agent_triggers = ["mikmik-core/agent_triggers"]
agent_triggers_remote = ["mikmik-core/agent_triggers_remote"]
extract_memories = ["mikmik-core/extract_memories"]
verification_agent = ["mikmik-core/verification_agent"]
builtin_explore_plan_agents = ["mikmik-core/builtin_explore_plan_agents"]
compaction_reminders = ["mikmik-core/compaction_reminders"]
agent_memory_snapshot = ["mikmik-core/agent_memory_snapshot"]
teammem = ["mikmik-core/teammem"]

# Tools & Infrastructure features (pass-through from cc-core)
bash_classifier = ["mikmik-core/bash_classifier"]
bridge_mode = ["mikmik-core/bridge_mode"]
mcp_rich_output = ["mikmik-core/mcp_rich_output"]
connector_text = ["mikmik-core/connector_text"]
unattended_retry = ["mikmik-core/unattended_retry"]
new_init = ["mikmik-core/new_init"]
powershell_auto_mode = ["mikmik-core/powershell_auto_mode"]
shot_stats = ["mikmik-core/shot_stats"]
tree_sitter_bash = ["mikmik-core/tree_sitter_bash"]
tree_sitter_bash_shadow = ["mikmik-core/tree_sitter_bash_shadow"]
native_clipboard_image = ["mikmik-core/native_clipboard_image"]
prompt_cache_break_detection = ["mikmik-core/prompt_cache_break_detection"]
ccr_auto_connect = ["mikmik-core/ccr_auto_connect"]
ccr_mirror = ["mikmik-core/ccr_mirror"]
ccr_remote_setup = ["mikmik-core/ccr_remote_setup"]

[dependencies]
mikmik-core = { workspace = true }
mikmik-api = { workspace = true }
mikmik-tools = { workspace = true }
mikmik-query = { workspace = true }
mikmik-plugins = { workspace = true }
mikmik-mcp = { workspace = true }
mikmik-buddy = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
similar = { workspace = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
once_cell = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
dashmap = { workspace = true }
icy_sixel = { workspace = true }
image = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
