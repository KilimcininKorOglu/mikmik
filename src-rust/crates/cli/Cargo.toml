[package]
name = "mikmik"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mikmik"
path = "src/main.rs"

[features]
default = ["voice", "computer-use"]
voice = ["mikmik-core/voice", "mikmik-tui/voice"]
# The desktop half of the tool roster. On by default so `computerUseEnabled`
# is the only thing deciding whether the model gets it; without this the
# setting decides nothing, because the tool is not compiled at all.
computer-use = ["mikmik-tools/computer-use"]

[dependencies]
mikmik-core = { workspace = true }
mikmik-api = { workspace = true }
mikmik-acp = { workspace = true }
mikmik-tools = { workspace = true }
mikmik-query = { workspace = true }
mikmik-tui = { workspace = true }
mikmik-commands = { workspace = true }
mikmik-mcp = { workspace = true }
mikmik-bridge = { workspace = true }
mikmik-buddy = { workspace = true }
mikmik-plugins = { workspace = true }
mikmik-shell = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
which = { workspace = true }
url = { workspace = true }
crossterm = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
open = "5"
urlencoding = "2"

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
