[package]
name = "mikmik-tools"
version.workspace = true
edition.workspace = true

[dependencies]
mikmik-core = { workspace = true }
mikmik-api = { workspace = true }
mikmik-mcp = { workspace = true }
mikmik-plugins = { workspace = true }
mikmik-shell = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
getrandom = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
grep-searcher = { workspace = true }
grep-regex = { workspace = true }
grep-matcher = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
which = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
open = { workspace = true }
enigo = { workspace = true, optional = true }
xcap = { workspace = true, optional = true }
image = { workspace = true, optional = true }

# PTY support — used by PtyBashTool on Unix
portable-pty = "0.9"

# Wire types for the ACP bridge in `acp_agent`. Schema only: the transport is
# a handful of lines of newline-delimited JSON, so the runtime crate would add
# a server we do not need. Kept at the same version as `mikmik-acp`.
agent-client-protocol-schema = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
# Used by PtyBashTool to poll the PTY master fd so the read loop can stop as soon
# as the direct child exits instead of hanging on a detached grandchild (#220/#184).
libc = "0.2"

# The accessibility backend in `computer_script/ax/macos.rs` reaches AXUIElement,
# a Core Foundation C API. `enigo` and `xcap` already build this crate on macOS,
# so it adds no new tree; naming it directly lets the module `use` it.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# The accessibility backend in `computer_script/ax/windows.rs` drives UI
# Automation, a COM API. The version matches one already in the tree so no new
# major of the `windows` crate is pulled; the features name only the namespaces
# the backend touches.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

# The accessibility backend in `computer_script/ax/linux.rs` reaches AT-SPI2
# over D-Bus. `zbus` blocking is used directly rather than the async `atspi`
# crate, because the backend trait is synchronous and the bridge already runs
# it on a blocking thread. Both crates are already in the tree via `xcap`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking"] }
zvariant = "5"

[features]
computer-use = ["dep:enigo", "dep:xcap", "dep:image"]
