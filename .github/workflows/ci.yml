name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'relay/**'
      - 'server/**'
      - 'editors/vscode/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-rust/**'
      - 'relay/**'
      - 'server/**'
      - 'editors/vscode/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ALSA headers for the voice feature's cpal dependency; wayland,
      # pipewire, EGL and libclang for computer-use's xcap and enigo (same
      # setup as release.yml). cmake — required by btls-sys/BoringSSL via
      # wreq — is preinstalled on all GitHub-hosted runners.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libpipewire-0.3-dev libclang-dev libegl-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: ci-${{ matrix.os }}-cargo-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: ci-${{ matrix.os }}-cargo-

      - name: Run tests
        working-directory: src-rust
        # Run serially: a number of tests mutate process-global state (env vars
        # like HOME / ANTHROPIC_API_KEY, etc.) and would otherwise race under
        # parallel execution, flaking non-deterministically across runners.
        run: cargo test --workspace --locked -- --test-threads=1

      # A test that resolves the config root without pointing MIKMIK_HOME at a
      # tempdir writes into the developer's real directory. That is invisible
      # locally until it has accumulated for weeks, so the runner checks that
      # the root was never created.
      - name: Assert the tests left the config root alone
        if: runner.os != 'Windows'
        run: |
          root="${XDG_CONFIG_HOME:-$HOME/.config}/mikmik"
          if [ -e "$root" ]; then
            echo "::error::tests wrote into $root — point MIKMIK_HOME at a tempfile::tempdir() in the test that did"
            find "$root" | head -50
            exit 1
          fi
          echo "config root untouched: $root"

      # Enforced (#227): clippy is clean under `-D warnings`, aside from a few
      # documented crate-level / targeted `#[allow]`s for noisy or risky lints.
      # rustfmt stays advisory below only because CRLF-terminated files can make
      # it disagree across runners; the tree itself is fmt-clean.
      - name: Clippy
        if: runner.os == 'Linux'
        working-directory: src-rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt (advisory)
        if: runner.os == 'Linux'
        working-directory: src-rust
        continue-on-error: true
        run: cargo fmt --all --check

  # The relay is a separate Cargo project with its own lockfile, so the job
  # above never builds it. One runner is enough: it is a plain axum service
  # with no platform-conditional code.
  relay:
    runs-on: ubuntu-latest
    name: Relay

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target
          key: ci-relay-cargo-${{ hashFiles('relay/Cargo.lock') }}
          restore-keys: ci-relay-cargo-

      - name: Run tests
        working-directory: relay
        run: cargo test --locked -- --test-threads=1

      - name: Clippy
        working-directory: relay
        run: cargo clippy --all-targets -- -D warnings

      - name: rustfmt
        working-directory: relay
        run: cargo fmt --all --check

  # The configuration server is a third separate Cargo project with its own
  # lockfile. Same reasoning as the relay: neither of the other two builds it.
  server:
    runs-on: ubuntu-latest
    name: Server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ci-server-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ci-server-cargo-

      - name: Run tests
        working-directory: server
        run: cargo test --locked -- --test-threads=1

      - name: Clippy
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: rustfmt
        working-directory: server
        run: cargo fmt --all --check

  # The VS Code extension is the only TypeScript in the repo, so nothing else
  # would catch a break in it. Driving the webview needs a GUI, so the tests
  # cover the parts that hold no DOM: chiefly what the markdown renderer
  # refuses, which is the only place the panel produces markup it did not build
  # node by node.
  vscode-extension:
    runs-on: ubuntu-latest
    name: VS Code extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Type-check
        working-directory: editors/vscode
        run: npm run check

      - name: Test
        working-directory: editors/vscode
        run: npm test

      - name: Package
        working-directory: editors/vscode
        run: npm run package
